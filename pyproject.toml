[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microc-foundation"
version = "0.1.0"
description = "Micro-C contact-matrix data foundation for the deep-learning course project"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "cooler>=0.10,<0.11",
  "h5py>=3.10,<4",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.1,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
microc-minimal = "microc_foundation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
